<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Báo cáo xe Demo</title>
<style>
:root{--ink:#14213d;--muted:#5c6780;--line:#d9dee8;--bg:#f4f6fa;--card:#fff;--accent:#1f5eff;--ok:#127a3e;--okbg:#def5e6;--abs:#7d6300;--absbg:#fff5c8;--bad:#b3261e;--badbg:#fde4e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
header h1{font-size:18px;font-weight:600;margin:0}
header p{margin:2px 0 0;font-size:14px;opacity:.82}
main{padding:16px;flex:1}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
button{font:inherit;border:0;border-radius:10px;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;font-weight:600;background:var(--accent);color:#fff;margin-top:10px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.link{background:none;color:var(--accent);padding:10px 0;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;padding:12px 14px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;text-align:left;font-weight:600}
.row small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.pill{flex:none;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:#eceff5;color:var(--muted);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.done{background:var(--okbg);color:var(--ok)}.pill.absent{background:var(--absbg);color:var(--abs)}.pill.missing,.pill.error{background:var(--badbg);color:var(--bad)}.pill.sending{background:#e2eaff;color:var(--accent)}
input,textarea,select{font:inherit;width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:600;margin:12px 0 6px}
.note{padding:11px 13px;border-radius:10px;margin-bottom:12px;font-size:14px;background:#e9eefb}
.note.warn{background:var(--absbg);color:#5c4900}.note.bad{background:var(--badbg);color:var(--bad)}.note.good{background:var(--okbg);color:var(--ok)}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.cam{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;z-index:5}
.cam .top{padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:#000}
.cam .top b{display:block;font-size:17px}.cam .top span{font-size:13px;opacity:.8}
.cam .view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
.cam video,.cam img{width:100%;height:100%;object-fit:contain;display:block}
.cam .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:#000}
.cam .bar button.txt{background:none;color:#fff;padding:12px 6px;min-width:76px;font-weight:600}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #9aa6bd;flex:none}
.cam .btn{margin:0;flex:1}
.steps{display:flex;gap:6px;margin-top:8px}.steps i{flex:1;height:4px;background:#444;border-radius:2px}.steps i.on{background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;color:var(--ink);text-align:left}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.shot span{display:block;padding:8px 10px;font-size:13px;font-weight:600}.shot em{display:block;font-style:normal;font-weight:400;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:12px;font-size:14px}
.card h3{font-size:15px;font-weight:600;margin:0 0 6px}.card h4{font-size:14px;font-weight:600;margin:10px 0 4px}.card ul,.card ol{margin:0;padding-left:20px}.card li{margin-bottom:3px}
.cam .top p{margin:4px 0 6px;font-size:14px;line-height:1.4}
.pill.late{background:#ffe9d2;color:#a85400}.pill.closed{background:#e6e6e6;color:#4d4d4d}
.bad-t{color:var(--bad)}
.cam .top{position:relative}
.cam .top:has(.refbtn){padding-right:118px}
.refbtn{position:absolute;right:12px;top:max(10px,env(safe-area-inset-top));width:96px;padding:0;background:#111;border:2px solid #fff;border-radius:8px;overflow:hidden;color:#fff;z-index:3}
.refbtn img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.refbtn span{display:block;font-size:11px;font-weight:600;text-align:center;padding:2px 0}
.cam .view{position:relative;overflow:hidden}
.ghost{position:absolute;object-fit:cover;opacity:.32;pointer-events:none}
.a4guide{opacity:1}
.a4guide::before{content:"";position:absolute;top:6%;bottom:13%;left:50%;transform:translateX(-50%);aspect-ratio:210/297;max-width:92%;border:3px dashed rgba(255,255,255,.9);border-radius:6px}
.a4guide span{position:absolute;left:8px;right:8px;bottom:3%;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}
.chip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:13px;padding:6px 12px;border-radius:99px;white-space:nowrap;z-index:2}
.cam .bar button.txt{font-size:14px;max-width:112px}
.refview{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.94);color:#fff;display:flex;flex-direction:column;gap:10px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.refscroll{flex:1;min-height:0;overflow:auto}
.refscroll h3{margin:0 0 4px;font-size:17px}.refscroll p{margin:0 0 12px;font-size:14px;opacity:.85}
.refview figure{margin:0 0 14px;position:relative}
.refview img{width:100%;border-radius:8px;display:block}
.refview .tag{position:absolute;left:8px;top:8px;font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;color:#fff}
.refview .tag.ok{background:#127a3e}.refview .tag.bad{background:#b3261e}
.refview figcaption{font-size:13px;margin-top:5px;color:#ffd7d3}
.cam .refview .btn{margin:0;flex:none;width:100%}
.refgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.refcell{margin:0}
.refcell img,.a4mini{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.a4mini{background:#f1f3f7;border:2px dashed #9aa6bd;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted)}
.refcell figcaption{font-size:11px;margin-top:3px;color:var(--muted);line-height:1.3}
@media (orientation:landscape) and (max-height:560px){
  .cam{flex-direction:row}
  .cam .top{position:absolute;left:0;top:0;right:140px;z-index:4;background:rgba(0,0,0,.55);padding:8px 12px;padding-left:max(12px,env(safe-area-inset-left))}
  .cam .top p{display:none}
  .cam .top:has(.refbtn){padding-right:96px}

  .cam .bar .btn{flex:none;width:100%;min-height:44px;font-size:14px;padding:8px}
  .chip{top:auto;bottom:10px}

.spin{padding:40px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:13px 15px;border-radius:10px;z-index:9;max-width:528px;margin:auto}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function now(){ return Date.now()+S.offset; }
function parts(ms){ const o={}; new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms)).forEach(p=>{o[p.type]=p.value;}); return o; }
function stampTime(ms){ const p=parts(ms); return p.day+'/'+p.month+'/'+p.year+' '+p.hour+':'+p.minute+':'+p.second; }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3500); }
function norm(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase(); }
function shell(title,sub,body){ $app.innerHTML='<header><h1>'+esc(title)+'</h1>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</header><main>'+inAppWarn()+body+'</main>'; window.scrollTo(0,0); }

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function errBox(msg){ return '<div class="note bad" style="margin-top:10px">'+esc(msg)+'</div>'; }
function deadlineText(){ const d=S.config.deadline||SNAPSHOT.deadline; return d.hour+':'+('0'+d.minute).slice(-2); }
function isLateNow(){ const d=S.config.deadline||SNAPSHOT.deadline, p=parts(now()); return Number(p.hour)*60+Number(p.minute) >= d.hour*60+d.minute; }

/* ---------- Gọi máy chủ ---------- */
async function request(url,opt){
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),60000);
  try{
    const res=await fetch(url,Object.assign({redirect:'follow',signal:ctrl.signal},opt));
    return await res.json();
  }catch(e){ return {ok:false,retry:true,network:true,error:'Mất kết nối mạng, app sẽ tự thử lại.'}; }
  finally{ clearTimeout(timer); }
}
function post(body){ return request(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}); }
async function postRetry(body,tries){
  let r; for(let i=0;i<tries;i++){ r=await post(body); if(r.ok||!r.retry) return r; await sleep(1500*(i+1)+Math.random()*1500); } return r;
}

  db:null, mem:new Map(),
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('xedemo',1); r.onupgradeneeded=()=>r.result.createObjectStore('jobs',{keyPath:'id'}); r.onsuccess=()=>{Q.db=r.result;res();}; r.onerror=()=>res(); }catch(e){res();} }); },
  tx(mode,fn){ return new Promise((res,rej)=>{ const t=Q.db.transaction('jobs',mode); const out=fn(t.objectStore('jobs')); t.oncomplete=()=>res(out&&out.result); t.onerror=t.onabort=()=>rej(t.error); }); },
  async put(j){ Q.mem.set(j.id,j); if(Q.db){ try{ await Q.tx('readwrite',s=>s.put(j)); }catch(e){} } },
  async del(id){ Q.mem.delete(id); if(Q.db){ try{ await Q.tx('readwrite',s=>s.delete(id)); }catch(e){} } },
  async load(){ if(Q.db){ try{ (await Q.tx('readonly',s=>s.getAll())||[]).forEach(j=>Q.mem.set(j.id,j)); }catch(e){} } },
  all(){ return [...Q.mem.values()]; }
};
function jobFor(model){ const s=S.session; return s&&Q.all().find(j=>j.dealerId===s.id&&j.model===model); }
async function pump(){
  if(S.working) return; S.working=true;
  let backoff=2000;
  try{
    for(;;){
      const job=Q.all().find(j=>!j.failed);
      if(!job) break;
      let stop=false;
      const reportAt=Math.max(...job.photos.map(x=>x.capturedAt));
      for(const p of job.photos){
        if(p.sent) continue;
        const r=await post({action:'upload',dealerId:job.dealerId,pin:job.pin,model:job.model,plate:job.plate,pos:p.pos,capturedAt:p.capturedAt,reportAt,gps:p.gps||'',image:p.image});
        if(r.ok){ p.sent=true; p.image=''; backoff=2000; await Q.put(job); refreshCars(); }
        else if(r.retry){ stop=true; break; }
        else { job.failed=r.error||'Không gửi được.'; await Q.put(job); refreshCars(); stop=true; break; }
      }
      if(!stop){
        const body=job.kind==='absent'
          ? {action:'absent',dealerId:job.dealerId,pin:job.pin,model:job.model,plate:job.plate,reason:job.reason,capturedAt:reportAt}
          : {action:'complete',dealerId:job.dealerId,pin:job.pin,model:job.model,plate:job.plate,capturedAt:reportAt};
        const r=await post(body);
        if(r.ok){
          await Q.del(job.id);
          if(S.session&&S.session.id===job.dealerId) setCars(r);
          backoff=2000; refreshCars(); toast((job.kind==='absent'?'Đã ghi nhận xe vắng ':'Đã gửi xong ')+job.model);
        }else if(r.retry){ stop=true; }
        else { job.failed=r.error||'Không gửi được.'; await Q.put(job); refreshCars(); }
      }
      if(stop&&!job.failed){ await sleep(backoff+Math.random()*1500); backoff=Math.min(backoff*2,30000); }
    }
  }finally{ S.working=false; }
}
window.addEventListener('online',()=>pump());

  if(S.session) store.set('cars',{id:S.session.id,date:todayKey(),cars:S.cars,plates:S.plates});
}
function loadCars(){ const c=store.get('cars'); const ok=c&&S.session&&c.id===S.session.id; S.cars=(ok&&c.date===todayKey())?c.cars:{}; S.plates=(ok&&c.plates)||{}; }
function brandModels(){ return S.config.brands[S.session.brand].models; }
function fullName(){ return S.config.brands[S.session.brand].name+' '+S.session.name; }
function dealerAddress(){ if(S.session.address) return S.session.address; const d=S.config.dealers.find(x=>x.id===S.session.id); return (d&&d.address)||''; }
function carState(m){ return (S.cars[m]||{state:'empty'}); }
function pillFor(m){
  const job=jobFor(m);
  if(job){
    if(job.failed) return ['error','Lỗi gửi'];
    return ['sending','Đang gửi '+job.photos.filter(p=>p.sent).length+'/'+job.photos.length];
  }
  const c=carState(m);
  if(c.state==='done') return ['done',c.text];
  if(c.state==='late') return ['late',c.text];
  if(c.state==='absent') return [/^Vắng trễ/.test(c.text)?'late':'absent',/^Vắng trễ/.test(c.text)?'Vắng (trễ)':'Xe vắng'];
  if(c.state==='closed') return ['closed','Nghỉ'];
  if(c.state==='missing') return ['missing','Thiếu'];
  return ['','Chưa báo cáo'];
}

  if(job&&!job.failed){ body+='<div class="note">Đang gửi báo cáo của xe này. Bạn có thể báo cáo xe khác trong lúc chờ.</div><button class="btn alt" id="back">Quay lại</button>'; }
  else if(job&&job.failed){ body+='<div class="note bad">'+esc(job.failed)+'</div>'+plateField(m)+'<div id="err"></div><button class="btn" id="shoot">Chụp lại 4 ảnh và Checksheet</button><button class="btn alt" id="back">Quay lại</button>'; }
  else if(c.state==='closed'){ body+='<div class="note">Hôm nay showroom đã báo nghỉ, không phải báo cáo xe này.</div><button class="btn alt" id="back">Quay lại</button>'; }
  else if(c.state==='done'||c.state==='late'){ body+='<div class="note '+(c.state==='late'?'warn':'good')+'">Đã báo cáo: '+esc(c.text)+'</div><p class="sub">Khắc phục xong hạng mục Không đạt thì chụp lại bộ ảnh mới. Chụp lại không làm thay đổi giờ báo cáo đầu tiên.</p>'+plateField(m)+'<div id="err"></div><button class="btn alt" id="shoot">Chụp lại / bổ sung ảnh</button>'+cancelBtn+'<button class="btn alt" id="back">Quay lại</button>'; }
  else if(c.state==='absent'){ body+='<div class="note warn">'+esc(c.text)+'</div>'+plateField(m)+'<div id="err"></div><button class="btn" id="shoot">Xe đã về, chụp 4 ảnh và Checksheet</button>'+cancelBtn+'<button class="btn alt" id="back">Quay lại</button>'; }
  else { body+=standardsHtml()+shotsHtml()+plateField(m)+'<div id="err"></div><button class="btn" id="shoot">Đã kiểm tra xong, bắt đầu chụp</button><button class="btn alt" id="absent">Xe vắng mặt hôm nay</button><button class="btn alt" id="back">Quay lại</button>'; }
  shell(fullName(),'Bước 2: '+m,body);
  on('back',()=>viewCars(false));
  on('shoot',async()=>{
    const plate=readPlate(m);
    if(!plate){ document.getElementById('err').innerHTML=errBox('Vui lòng nhập đúng biển số xe (4–12 chữ và số).'); return; }
    if(job&&job.failed) await Q.del(job.id);
    startCapture(m,'photos','',plate);
  });
  on('absent',()=>viewAbsent(m));
  on('cancel',()=>viewCancel(m));
}

/* ---------- Xe vắng: ghi lý do và chụp Checksheet ---------- */
function viewAbsent(m){
  S.screen='absent';
  const min=S.config.minReason;
  shell(fullName(),'Xe vắng: '+m,'<div class="note">Theo quy định: xe vắng mặt vẫn phải có Checksheet ghi rõ lý do, có chữ ký DP.</div><label for="reason">Lý do xe không có mặt (bắt buộc)</label><textarea id="reason" placeholder="Ví dụ: Xe đi sự kiện tại TTTM Aeon, dự kiến về 17h"></textarea>'+plateField(m)+'<div id="err"></div><button class="btn" id="save">Chụp Checksheet ghi lý do</button><button class="btn alt" id="back">Quay lại</button>');
  on('back',()=>viewCar(m));
  on('save',()=>{
    const reason=document.getElementById('reason').value.trim(), err=document.getElementById('err');
    if(reason.length<min){ err.innerHTML=errBox('Vui lòng ghi rõ lý do, tối thiểu '+min+' ký tự.'); return; }
    const plate=readPlate(m);
    if(!plate){ err.innerHTML=errBox('Vui lòng nhập đúng biển số xe (4–12 chữ và số).'); return; }
    startCapture(m,'absent',reason,plate);
  });
}

/* ---------- Showroom nghỉ ---------- */
function viewClosed(){
  S.screen='closedForm';
  const min=S.config.minReason;
  shell(fullName(),'Showroom nghỉ hôm nay','<div class="note">Chỉ dùng khi cả showroom nghỉ cả ngày. Ngày nghỉ không phải báo cáo.</div><label for="reason">Lý do nghỉ (bắt buộc)</label><textarea id="reason" placeholder="Ví dụ: Nghỉ lễ theo lịch của Đại lý"></textarea><div id="err"></div><button class="btn" id="save">Xác nhận showroom nghỉ</button><button class="btn alt" id="back">Quay lại</button>');
  on('back',()=>viewCars(false));
  on('save',async()=>{
    const reason=document.getElementById('reason').value.trim(), err=document.getElementById('err'), b=document.getElementById('save');
    if(reason.length<min){ err.innerHTML=errBox('Vui lòng ghi rõ lý do, tối thiểu '+min+' ký tự.'); return; }
    b.disabled=true; b.textContent='Đang gửi…';
    const r=await postRetry({action:'closed',dealerId:S.session.id,pin:S.session.pin,reason},4);
    if(!r.ok){ b.disabled=false; b.textContent='Xác nhận showroom nghỉ'; err.innerHTML=errBox(r.error); return; }
    setCars(r); toast('Đã ghi nhận showroom nghỉ'); viewCars(false);
  });
}

/* ---------- Chọn nhầm đại lý: huỷ báo cáo xe này ---------- */
function viewCancel(m){
  S.screen='cancel';
  shell(fullName(),'Huỷ báo cáo: '+m,'<div class="note warn">Ảnh đã đóng dấu tên <b>'+esc(fullName())+'</b> nên không chuyển sang đại lý khác được. Huỷ sẽ xoá ảnh của xe '+esc(m)+' hôm nay tại đại lý này. Sau đó chọn <b>Đổi đại lý</b> và chụp lại ở đúng đại lý.</div><div id="err"></div><button class="btn danger" id="save">Huỷ báo cáo xe '+esc(m)+'</button><button class="btn alt" id="back">Quay lại</button>');
  on('back',()=>viewCar(m));
  on('save',async()=>{
    const b=document.getElementById('save'), err=document.getElementById('err');
    b.disabled=true; b.textContent='Đang huỷ…';
    const r=await postRetry({action:'cancel',dealerId:S.session.id,pin:S.session.pin,model:m},3);
    if(!r.ok){ b.disabled=false; b.textContent='Huỷ báo cáo xe '+m; err.innerHTML=errBox(r.error); return; }
    setCars(r); toast('Đã huỷ báo cáo xe '+m); viewCars(false);
  });
}

/* ---------- Bước 3: camera trực tiếp, không có lựa chọn tải ảnh ---------- */
function positions(){ return S.config.positions; }
function getGps(){
  S.gps='';
  if(!navigator.geolocation) return;
  try{ navigator.geolocation.getCurrentPosition(p=>{ S.gps=p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5)+' ±'+Math.round(p.coords.accuracy)+'m'; },()=>{},{enableHighAccuracy:true,timeout:10000,maximumAge:120000}); }catch(e){}
}
function startCapture(m,kind,reason,plate){
  S.model=m; S.kind=kind; S.reason=reason; S.plate=plate;
  const cs=positions().find(p=>p.id===CHECKSHEET_POS);
  S.capPos=kind==='absent'?[{id:cs.id,label:'Checksheet xe vắng',hint:'Checksheet ghi rõ lý do xe vắng mặt, có chữ ký DP (hoặc người được uỷ quyền).'}]:positions();
  S.shots=S.capPos.map(()=>null); S.stepIdx=0; S.retakeOnly=false;
  getGps(); openCamera();
}
function stopCamera(){ S.camRun=(S.camRun||0)+1; if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; } }
async function openCamera(){
  S.screen='camera';
  const run=S.camRun=(S.camRun||0)+1;
  const p=S.capPos[S.stepIdx];
  const g=guideFor(p.id);
  $app.innerHTML='<div class="cam"><div class="top">'+refThumb(p)+'<b>'+esc(p.label)+'</b><p>'+esc(p.hint||'')+'</p><span>'+esc(fullName())+' · '+esc(S.model)+' · '+esc(S.plate)+' · Bước '+(S.stepIdx+1)+'/'+S.capPos.length+'</span><div class="steps">'+S.capPos.map((_,i)=>'<i class="'+(S.shots[i]?'on':'')+'"></i>').join('')+'</div></div><div class="view" id="view"><video id="v" playsinline autoplay muted></video>'+(g.img?'<img id="ghost" class="ghost" alt="" src="'+REF_IMAGES[g.img]+'">':'')+(g.a4?'<div id="ghost" class="ghost a4guide"><span>Đặt cả tờ Checksheet trong khung, thấy rõ chữ ký</span></div>':'')+'<div id="rotate" class="chip" hidden>Xoay ngang điện thoại để giống ảnh mẫu</div></div><div class="bar"><button class="txt" id="cancel">Huỷ</button><button class="shutter" id="snap" aria-label="Chụp ảnh" disabled></button><button class="txt" id="ghostbtn">'+(ghostOn()?'Khung mờ: Bật':'Khung mờ: Tắt')+'</button></div></div>';
  on('refbtn',()=>viewRef(p));
  on('ghostbtn',()=>{ store.set('ghost',!ghostOn()); document.getElementById('ghostbtn').textContent=ghostOn()?'Khung mờ: Bật':'Khung mờ: Tắt'; placeGhost(); });
  on('cancel',()=>{ stopCamera(); if(S.retakeOnly){ viewReview(); return; } if(S.shots.some(Boolean)&&!confirm('Huỷ các ảnh vừa chụp của xe này?')){ openCamera(); return; } viewCar(S.model); });
  try{
    if(!S.stream||!S.stream.active){
      const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
      if(run!==S.camRun){ stream.getTracks().forEach(t=>t.stop()); return; }
      S.stream=stream;
    }
    const v=document.getElementById('v'); if(!v) return stopCamera();
    v.srcObject=S.stream; v.onloadedmetadata=placeGhost; v.onresize=placeGhost; await v.play().catch(()=>{}); placeGhost();
    const snap=document.getElementById('snap'); snap.disabled=false; snap.onclick=()=>capture(v);
  }catch(e){
    if(run!==S.camRun) return;
    stopCamera();
    const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    shell(fullName(),'Không mở được camera','<div class="note bad">'+(denied?'Trình duyệt đang chặn camera. Hãy cho phép quyền Camera cho trang này rồi thử lại, hoặc mở link bằng Chrome/Safari.':'Không mở được camera của thiết bị. Vui lòng dùng điện thoại có camera sau.')+'</div><button class="btn" id="again">Thử lại</button><button class="btn alt" id="back">Quay lại</button>');
    on('again',openCamera); on('back',()=>viewCar(S.model));
  }
}
function ghostOn(){ const v=store.get('ghost'); return v===null?true:!!v; }
function refThumb(p){ const g=guideFor(p.id); return g.img?'<button class="refbtn" id="refbtn" aria-label="Xem ảnh mẫu"><img alt="" src="'+REF_IMAGES[g.img]+'"><span>Ảnh mẫu</span></button>':''; }
function placeGhost(){
  const v=document.getElementById('v'), gh=document.getElementById('ghost'), view=document.getElementById('view'), rot=document.getElementById('rotate');
  if(!v||!view) return;
  const W=view.clientWidth, H=view.clientHeight, vw=v.videoWidth, vh=v.videoHeight;
  if(rot) rot.hidden=!(vw&&vh>vw&&!guideFor((S.capPos[S.stepIdx]||{}).id).a4);
  if(!gh) return;
  gh.hidden=!ghostOn()||!vw;
  if(!vw) return;
  const s=Math.min(W/vw,H/vh), w=vw*s, h=vh*s;
  Object.assign(gh.style,{left:((W-w)/2)+'px',top:((H-h)/2)+'px',width:w+'px',height:h+'px'});
}
window.addEventListener('resize',placeGhost);
function viewRef(p){
  const g=guideFor(p.id); if(!g.img) return;
  const box=document.createElement('div'); box.className='refview';
  box.innerHTML='<div class="refscroll"><h3>'+esc(p.label)+'</h3><p>'+esc(p.hint||'')+'</p><figure><span class="tag ok">ĐẠT</span><img alt="Ảnh mẫu đạt" src="'+REF_IMAGES[g.img]+'"></figure>'+(g.bad||[]).map(b=>'<figure><span class="tag bad">CHƯA ĐẠT</span><img alt="" src="'+REF_IMAGES[b[0]]+'"><figcaption>'+esc(b[1])+'</figcaption></figure>').join('')+'</div><button class="btn" id="refclose">Đã hiểu, quay lại chụp</button>';
  ($app.querySelector('.cam')||$app).appendChild(box);
  on('refclose',()=>box.remove());
}
/* Timemark: tên Đại lý, ngày giờ, địa chỉ, dòng xe, biển số. Đặt ở dải riêng bên dưới, không che ảnh. */
function capture(v){
  if(!v.videoWidth) return toast('Camera chưa sẵn sàng, vui lòng thử lại.');
  const ts=now(), scale=Math.min(1,MAX_EDGE/Math.max(v.videoWidth,v.videoHeight));
  const w=Math.round(v.videoWidth*scale), h=Math.round(v.videoHeight*scale);
  const p=S.capPos[S.stepIdx];
  const fs=Math.max(15,Math.round(Math.max(w,h)*0.021)), pad=Math.round(fs*0.55), lines=3, barH=fs*lines+pad*(lines+1);
  const c=document.createElement('canvas'); c.width=w; c.height=h+barH;
  const g=c.getContext('2d'); g.drawImage(v,0,0,w,h);
  g.fillStyle='#000'; g.fillRect(0,h,w,barH);
  g.fillStyle='#fff'; g.textBaseline='top';
  const font=wt=>(wt?'600 ':'')+fs+'px system-ui,-apple-system,Roboto,Arial,sans-serif';
  g.font=font(true); g.fillText(stampTime(ts)+'  ·  '+fullName(),pad,h+pad,w-pad*2);
  g.font=font(false); g.fillText(dealerAddress()||'Địa chỉ: chưa cập nhật',pad,h+pad*2+fs,w-pad*2);
  g.fillText(S.model+'  ·  '+S.plate+'  ·  '+p.label+(S.gps?'  ·  GPS '+S.gps:''),pad,h+pad*3+fs*2,w-pad*2);
  const dataUrl=c.toDataURL('image/jpeg',p.id===CHECKSHEET_POS?CHECKSHEET_QUALITY:JPEG_QUALITY);
  S.shots[S.stepIdx]={pos:p.id,capturedAt:ts,gps:S.gps,dataUrl};
  viewShot();
}
function viewShot(){
  S.screen='shot';
  const s=S.shots[S.stepIdx], p=S.capPos[S.stepIdx];
  $app.innerHTML='<div class="cam"><div class="top">'+refThumb(p)+'<b>'+esc(p.label)+'</b><p>'+esc(p.hint||'')+'</p><span>So với ảnh mẫu trước khi dùng</span></div><div class="view"><img id="pv" alt="Ảnh vừa chụp" src="'+s.dataUrl+'"></div><div class="bar"><button class="btn alt" id="redo">Chụp lại</button><button class="btn" id="use">Dùng ảnh này</button></div></div>';
  on('refbtn',()=>viewRef(p));
  on('redo',()=>openCamera());
  on('use',()=>{
    const next=S.shots.findIndex(x=>!x);
    if(next<0||S.retakeOnly){ stopCamera(); viewReview(); }
    else { S.stepIdx=next; openCamera(); }
  });
}
function viewReview(){
  S.screen='review'; S.retakeOnly=true;
  const absent=S.kind==='absent';
  shell(fullName(),'Kiểm tra trước khi gửi: '+S.model,'<div class="note">Đang báo cáo cho <b>'+esc(fullName())+'</b>, xe <b>'+esc(S.model)+'</b>, biển số <b>'+esc(S.plate)+'</b>'+(absent?'. Xe vắng: '+esc(S.reason):'')+'. Kiểm tra ảnh rõ nét, đúng góc; ảnh taplo đọc được mức xăng/pin và ODO; Checksheet đủ chữ ký DP. Bấm vào ảnh nếu muốn chụp lại.</div><div class="grid">'+S.shots.map((s,i)=>'<button class="shot" data-i="'+i+'"><img alt="" src="'+s.dataUrl+'"><span>'+esc(S.capPos[i].label)+'<em>Chụp lại</em></span></button>').join('')+'</div><button class="btn" id="send">'+(absent?'Gửi báo cáo xe vắng':'Gửi báo cáo xe này')+'</button>');
  $app.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{ S.stepIdx=Number(el.dataset.i); openCamera(); });
  on('send',async()=>{
    const job={id:S.session.id+'|'+S.model+'|'+Date.now(),kind:S.kind,reason:S.reason,dealerId:S.session.id,pin:S.session.pin,model:S.model,plate:S.plate,photos:S.shots.map(s=>({pos:s.pos,capturedAt:s.capturedAt,gps:s.gps,image:s.dataUrl.split(',')[1]}))};
    await Q.put(job); S.shots=[]; viewCars(false); pump();
  });
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) return; if(S.screen==='camera'&&S.stream&&!S.stream.active) openCamera(); else if(S.screen==='cars'&&S.session) viewCars(true); pump(); });
boot();
</script>
</body>
